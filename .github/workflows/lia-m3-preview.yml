name: LIA M3 preview validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    name: lia-m3 / gvo-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node tools/audit_assets.mjs
      - run: node tools/qa/lia_m3_guards.mjs
