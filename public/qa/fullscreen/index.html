<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow" />
    <title>GVO · Probe fullscreen móvil 014B</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #101820;
        color: #f1faf7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: max(16px, env(safe-area-inset-top))
          max(14px, env(safe-area-inset-right))
          max(18px, env(safe-area-inset-bottom))
          max(14px, env(safe-area-inset-left));
        background: linear-gradient(160deg, #101820, #17333a);
      }

      main {
        width: min(100%, 760px);
        margin: 0 auto;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.45rem, 7vw, 2rem);
      }

      p {
        line-height: 1.45;
      }

      .status {
        padding: 12px;
        border: 1px solid #74cbd0;
        border-radius: 10px;
        background: rgb(7 18 25 / 72%);
        overflow-wrap: anywhere;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
        margin: 16px 0;
      }

      button {
        min-height: 48px;
        padding: 10px 12px;
        border: 1px solid #a7edf0;
        border-radius: 8px;
        color: #f1faf7;
        background: #163942;
        font: inherit;
        font-weight: 700;
        touch-action: manipulation;
      }

      button:disabled {
        opacity: 0.48;
      }

      dl {
        display: grid;
        grid-template-columns: minmax(130px, 0.8fr) minmax(0, 1.2fr);
        gap: 1px;
        border: 1px solid #31525a;
        background: #31525a;
      }

      dt,
      dd {
        min-width: 0;
        margin: 0;
        padding: 8px;
        background: #101820;
        overflow-wrap: anywhere;
      }

      dt {
        color: #b7dfe0;
        font-weight: 700;
      }

      pre {
        max-height: 42dvh;
        padding: 12px;
        overflow: auto;
        border: 1px solid #31525a;
        background: #071219;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      @media (max-width: 460px) {
        dl {
          grid-template-columns: 1fr;
        }

        dd {
          border-bottom: 1px solid #31525a;
        }
      }
    </style>
  </head>
  <body>
    <main data-gvo-qa-probe="debt-014b-mobile-fullscreen">
      <h1>Probe fullscreen móvil · GVO_DEBT_014B</h1>
      <p>
        Herramienta técnica fuera del recorrido visitante. No confunde el
        fallback del navegador con fullscreen real.
      </p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div class="actions">
        <button id="request" type="button">PROBAR FULLSCREEN</button>
        <button id="exit" type="button">SALIR FULLSCREEN</button>
        <button id="copy" type="button">COPIAR DIAGNÓSTICO</button>
      </div>
      <dl id="fields"></dl>
      <h2>Diagnóstico copiable</h2>
      <pre id="diagnostic"></pre>
    </main>
    <script>
      (() => {
        const root = document.documentElement;
        const status = document.querySelector("#status");
        const fields = document.querySelector("#fields");
        const diagnostic = document.querySelector("#diagnostic");
        const requestButton = document.querySelector("#request");
        const exitButton = document.querySelector("#exit");
        const copyButton = document.querySelector("#copy");
        const initialActivation = {
          isActive: navigator.userActivation?.isActive ?? null,
          hasBeenActive: navigator.userActivation?.hasBeenActive ?? null,
        };
        const requestOutcome = {
          method: "not-requested",
          beforeTapActivation: initialActivation,
          duringTapActivation: null,
          result: "not-requested",
          errorName: null,
          errorMessage: null,
        };

        function policyAllowsFullscreen() {
          const policy = document.permissionsPolicy ?? document.featurePolicy;
          if (typeof policy?.allowsFeature !== "function") return null;
          try {
            return policy.allowsFeature("fullscreen");
          } catch {
            return null;
          }
        }

        function requestContract() {
          if (typeof root.requestFullscreen === "function") {
            return { method: "standard", invoke: () => root.requestFullscreen() };
          }
          if (typeof root.webkitRequestFullscreen === "function") {
            return {
              method: "webkitRequestFullscreen",
              invoke: () => root.webkitRequestFullscreen(),
            };
          }
          if (typeof root.webkitRequestFullScreen === "function") {
            return {
              method: "webkitRequestFullScreen",
              invoke: () => root.webkitRequestFullScreen(),
            };
          }
          return { method: "none", invoke: null };
        }

        function exitContract() {
          if (typeof document.exitFullscreen === "function") {
            return { method: "standard", invoke: () => document.exitFullscreen() };
          }
          if (typeof document.webkitExitFullscreen === "function") {
            return {
              method: "webkitExitFullscreen",
              invoke: () => document.webkitExitFullscreen(),
            };
          }
          if (typeof document.webkitCancelFullScreen === "function") {
            return {
              method: "webkitCancelFullScreen",
              invoke: () => document.webkitCancelFullScreen(),
            };
          }
          return { method: "none", invoke: null };
        }

        function fullscreenElement() {
          return document.fullscreenElement ?? document.webkitFullscreenElement ?? null;
        }

        function capability() {
          const request = requestContract();
          const exit = exitContract();
          if (request.method === "none" || exit.method === "none") {
            return "fullscreen-unavailable-on-platform";
          }
          const explicitlyDisabled =
            request.method === "standard"
              ? document.fullscreenEnabled === false
              : document.webkitFullscreenEnabled === false;
          if (explicitlyDisabled || policyAllowsFullscreen() === false) {
            return "fullscreen-blocked-by-context";
          }
          return fullscreenElement()
            ? "active"
            : "fullscreen-supported";
        }

        function displayMode(mode) {
          try {
            return matchMedia(`(display-mode: ${mode})`).matches;
          } catch {
            return false;
          }
        }

        function snapshot() {
          const viewport = window.visualViewport;
          return {
            capturedAt: new Date().toISOString(),
            url: location.href,
            protocol: location.protocol,
            hostname: location.hostname,
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            vendor: navigator.vendor,
            maxTouchPoints: navigator.maxTouchPoints,
            screen: `${screen.width}x${screen.height}`,
            innerViewport: `${innerWidth}x${innerHeight}`,
            visualViewport: viewport
              ? `${viewport.width}x${viewport.height} @ ${viewport.offsetLeft},${viewport.offsetTop}`
              : "unavailable",
            topLevel: window.top === window.self,
            secureContext: window.isSecureContext,
            fullscreenEnabled: document.fullscreenEnabled ?? null,
            fullscreenElement: fullscreenElement()?.tagName ?? null,
            standardRequest: typeof root.requestFullscreen,
            standardExit: typeof document.exitFullscreen,
            webkitRequestFullscreen: typeof root.webkitRequestFullscreen,
            webkitRequestFullScreen: typeof root.webkitRequestFullScreen,
            webkitExitFullscreen: typeof document.webkitExitFullscreen,
            webkitCancelFullScreen: typeof document.webkitCancelFullScreen,
            webkitFullscreenEnabled: document.webkitFullscreenEnabled ?? null,
            permissionsPolicyFullscreen: policyAllowsFullscreen(),
            navigatorStandalone: navigator.standalone ?? null,
            displayModeFullscreen: displayMode("fullscreen"),
            displayModeStandalone: displayMode("standalone"),
            displayModeMinimalUi: displayMode("minimal-ui"),
            capability: capability(),
            requestOutcome,
          };
        }

        function render() {
          const data = snapshot();
          status.textContent = `Capability: ${data.capability} · Request: ${requestContract().method} · Resultado: ${requestOutcome.result}`;
          requestButton.disabled = data.capability !== "fullscreen-supported";
          exitButton.disabled = !fullscreenElement();
          fields.replaceChildren(
            ...Object.entries(data)
              .filter(([key]) => key !== "requestOutcome")
              .flatMap(([key, value]) => {
                const term = document.createElement("dt");
                const description = document.createElement("dd");
                term.textContent = key;
                description.textContent = String(value);
                return [term, description];
              }),
          );
          diagnostic.textContent = JSON.stringify(data, null, 2);
        }

        requestButton.addEventListener("click", async () => {
          const contract = requestContract();
          requestOutcome.method = contract.method;
          requestOutcome.duringTapActivation = {
            isActive: navigator.userActivation?.isActive ?? null,
            hasBeenActive: navigator.userActivation?.hasBeenActive ?? null,
          };
          requestOutcome.errorName = null;
          requestOutcome.errorMessage = null;
          try {
            const nativeResult = contract.invoke?.();
            requestOutcome.result = "pending";
            render();
            await Promise.resolve(nativeResult);
            requestOutcome.result = fullscreenElement()
              ? "fullscreen-element-present"
              : "resolved-without-fullscreen-element";
          } catch (error) {
            requestOutcome.result = "rejected";
            requestOutcome.errorName = error?.name ?? "UnknownError";
            requestOutcome.errorMessage = error?.message ?? String(error);
          }
          render();
        });

        exitButton.addEventListener("click", async () => {
          const contract = exitContract();
          try {
            await Promise.resolve(contract.invoke?.());
          } catch (error) {
            requestOutcome.errorName = error?.name ?? "UnknownError";
            requestOutcome.errorMessage = error?.message ?? String(error);
          }
          render();
        });

        copyButton.addEventListener("click", async () => {
          const text = JSON.stringify(snapshot(), null, 2);
          try {
            await navigator.clipboard.writeText(text);
            copyButton.textContent = "DIAGNÓSTICO COPIADO";
          } catch {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.setAttribute("readonly", "");
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.append(textarea);
            textarea.select();
            document.execCommand("copy");
            textarea.remove();
            copyButton.textContent = "COPIA SOLICITADA";
          }
        });

        ["fullscreenchange", "webkitfullscreenchange", "fullscreenerror", "webkitfullscreenerror"].forEach(
          (eventName) => document.addEventListener(eventName, render),
        );
        addEventListener("resize", render);
        addEventListener("orientationchange", render);
        window.visualViewport?.addEventListener("resize", render);
        render();
      })();
    </script>
  </body>
</html>
